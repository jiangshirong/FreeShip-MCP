name: Publish tested Windows build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build workflow run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
        default: v0.3.1
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify successful source build
        id: source
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          python - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success', 'Build must have passed'
          assert r['head_branch'] == 'main', 'Only builds from main can be published'
          assert r['head_repository']['full_name'] == os.environ['GH_REPO']
          assert r['path'] == '.github/workflows/windows.yml'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + r['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: FreeShip-MCP-Windows-x64
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and checksum release files
        working-directory: release
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('.').iterdir())
          assert len(files) == 4 and all(p.is_file() for p in files)
          assert {p.suffix for p in files} == {'.whl', '.zip', '.gz'}
          Path('SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in files), encoding='ascii')
          PY
      - name: Upload and publish preview
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          gh release edit "$RELEASE_TAG" --target "$SOURCE_SHA"
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
